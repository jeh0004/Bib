# Isolated sandbox; NEVER mount production database or uploads.
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8081:5000"
    volumes:
      - phase3_test_data:/data
    environment:
      DATABASE: /data/vereinsbibliothek.db
      COOKIE_SECURE: "false"
    restart: "no"
volumes:
  phase3_test_data:
