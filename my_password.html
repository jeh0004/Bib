{% extends 'base.html' %}
{% block title %}{{ t.pw_self_title }} – Vereinsbibliothek{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="card-title mb-4"><i class="bi bi-shield-lock"></i> {{ t.pw_self_title }}</h5>
        <div class="alert alert-info small">
          <strong>{{ t.pw_req_title }}</strong>
          <ul class="mb-0 ps-3">
            <li>{{ t.pw_req_length }}</li>
            <li>{{ t.pw_req_case }}</li>
            <li>{{ t.pw_req_digit }}</li>
            <li>{{ t.pw_req_special }}</li>
          </ul>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">{{ t.pw_current }}</label>
            <input type="password" name="current_password" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ t.pw_new }}</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ t.pw_confirm }}</label>
            <input type="password" name="password2" class="form-control" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ t.pw_save }}</button>
            <a href="{{ url_for('catalog') }}" class="btn btn-outline-secondary">{{ t.pw_cancel }}</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
