{% extends 'base.html' %}
{% block title %}{{ t.edit_book_title }} – Vereinsbibliothek{% endblock %}
{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('admin_books') }}">{{ t.books_title }}</a></li>
    <li class="breadcrumb-item active">{{ t.edit_book_title }}</li>
  </ol>
</nav>

<h1 class="h3 mb-4">{{ t.edit_book_title }}</h1>

<div class="card shadow-sm" style="max-width: 600px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">{{ t.field_title }} <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ t.field_author }} <span class="text-danger">*</span></label>
        <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label">{{ t.field_isbn }}</label>
          <input type="text" name="isbn" class="form-control" value="{{ book.isbn or '' }}">
        </div>
        <div class="col">
          <label class="form-label">{{ t.field_category }}</label>
          <input type="text" name="category" class="form-control" value="{{ book.category or '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ t.field_copies }}</label>
        <input type="number" name="total_copies" class="form-control" value="{{ book.total_copies }}" min="1">
      </div>
      <div class="mb-3">
        <label class="form-label">{{ t.field_description }}</label>
        <textarea name="description" class="form-control" rows="4">{{ book.description or '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ t.btn_save }}</button>
        <a href="{{ url_for('admin_books') }}" class="btn btn-outline-secondary">{{ t.btn_cancel }}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
