services:
  web:
    image: ninelivesdev/leihgut:latest
    ports:
      - "8080:5000"                        # ← Port anpassen falls belegt
    volumes:
      - db_data:/data
    environment:
      - COOKIE_SECURE=false               # auf "true" setzen wenn HTTPS aktiv
    restart: unless-stopped

volumes:
  db_data:
