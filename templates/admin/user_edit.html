{% extends 'base.html' %}
{% block title %}{{ t.edit_user_title }} – Vereinsbibliothek{% endblock %}
{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('admin_users') }}">{{ t.users_title }}</a></li>
    <li class="breadcrumb-item active">{{ t.edit_user_title }}</li>
  </ol>
</nav>

<h1 class="h3 mb-4">{{ t.edit_user_title }}: {{ user.username }}</h1>

<div class="card shadow-sm" style="max-width: 500px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">{{ t.field_full_name }}</label>
        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ t.field_email }}</label>
        <input type="email" name="email" class="form-control" value="{{ user.email or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">{{ t.field_role }}</label>
        <select name="role" class="form-select">
          <option value="user" {{ 'selected' if user.role == 'user' }}>{{ t.role_member }}</option>
          <option value="admin" {{ 'selected' if user.role == 'admin' }}>{{ t.role_admin }}</option>
        </select>
      </div>
      <div class="mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="is_active" id="isActive"
                 {{ 'checked' if user.is_active }}>
          <label class="form-check-label" for="isActive">{{ t.field_active }}</label>
        </div>
      </div>
      <hr>
      <div class="mb-3">
        <label class="form-label">{{ t.field_new_pw }} <span class="text-muted small">{{ t.field_new_pw_hint }}</span></label>
        <input type="password" name="new_password" class="form-control">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ t.btn_save }}</button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">{{ t.btn_cancel }}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
